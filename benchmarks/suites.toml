# ==============================================================================
# SWCP Benchmark Suite Configuration (2-Node Cluster Defaults)
# ==============================================================================
# Edit rates, ramp durations, burst sizes, or vLLM sweep grids here to tune
# resolution and cluster headroom without modifying CLI wrapper scripts.
# All values can still be overridden per invocation via CLI flags.

[common]
users = 200
hardware_tag = "2node-rtx5070ti"
warmup = true

# Goal 1: Single-Node vLLM Hardware Parameter Sweep (used by scripts/sweep-vllm.sh)
# Uses closed-loop concurrency so the GPU stays saturated with bounded queue depth.
[suites.vllm_sweep]
arrival_mode = "closed-loop"
concurrency = "48"
think_time_min_s = 0.0
think_time_max_s = 0.0
step_duration_s = 120
min_completions = 16
mem_values = "0.88"
seqs_values = "4,8,12,16,24,32,48"

# Goal 2: Infinite-GPU Non-GPU Bottleneck & Autoscaling Discovery
# Smooth ramp with 5ms mock LLM across both nodes (0 spilled worker pods at start).
[suites.infinite_gpu]
arrival_mode = "continuous-ramp"
start_rate = 100.0
end_rate = 800.0
ramp_duration_s = 420.0
bucket_duration_s = 30.0
mock_llm = true

# Goal 3: 2-Node Spillover & Dual-GPU Saturation Ramp
# Single continuous ramp from idle worker baseline up toward a high safety ceiling,
# stopping automatically once sustained backlog growth + completion deficit confirm saturation.
[suites.ramp_capacity]
arrival_mode = "continuous-ramp"
start_rate = 30.0
end_rate = 1000.0
ramp_duration_s = 970.0
bucket_duration_s = 30.0
stop_on_saturation = true
saturation_confirm_buckets = 3
saturation_deficit_ratio = 0.12
mock_llm = false

# Goal 4: Hybrid SLA & Stage Breakdown Verification Plateaus
# Targeted fixed-rate steps spanning 1-node steady, 2-node spillover, and a
# finite T-second overload burst. Produces BOTH sla_capacity_curve.png and
# pipeline_latency_breakdown_stacked.png.
[suites.sla_curve]
arrival_mode = "stepped-poisson"
rates = "40,80,120,160,200,240"
step_duration_s = 90.0
min_completions = 12
mock_llm = false

# Goal 5: Classroom Deadline Thundering-Herd Burst & Drain Time
# Simultaneous submissions sent over a short deadline window from cold worker baseline.
[suites.burst]
arrival_mode = "burst"
bursts = "20,40,60,80,100,120"
burst_window_s = 3.0
drain_timeout_s = 300.0
mock_llm = false
