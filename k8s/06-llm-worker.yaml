apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-worker
  namespace: swcp
  labels:
    app.kubernetes.io/name: llm-worker
    app.kubernetes.io/part-of: swcp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-worker
        app.kubernetes.io/part-of: swcp
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
      containers:
        - name: llm-worker
          image: ghcr.io/allankrogaau/llm-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: llm-worker-config
            - secretRef:
                name: llm-worker-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
