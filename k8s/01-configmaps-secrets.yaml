apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
data:
  POSTGRES_DB: swcp
  POSTGRES_USER: swcp
  PGDATA: /var/lib/postgresql/18/docker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-api-config
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  Nats__Url: nats://nats.swcp.svc.cluster.local:4222
  Jwt__KeyDirectory: /private
  Jwt__PublicKeyDirectory: /public
  Jwt__Issuer: SWCP.CoreApi
  Jwt__Audience: SWCP.Client
  SeedDevelopmentUsers: "false"
  SeedSampleAssignments: "true"
  DevelopmentUsers__TeacherUsername: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  Nats__Url: nats://nats.swcp.svc.cluster.local:4222
  Jwt__PublicKeyPath: /public/jwt-public.pem
  Jwt__Issuer: SWCP.CoreApi
  Jwt__Audience: SWCP.Client
  CoreApi__Url: http://core-api.swcp.svc.cluster.local:8080
  ReverseProxy__Clusters__coreApi__Destinations__primary__Address: http://core-api.swcp.svc.cluster.local:8080/
  Cors__AllowedOrigins__0: http://swcp.local
  Cors__AllowedOrigins__1: https://swcp.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-worker-config
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
data:
  DOTNET_ENVIRONMENT: Production
  Nats__Url: nats://nats.swcp.svc.cluster.local:4222
  LocalLlm__BaseUrl: http://local-llm-server.swcp.svc.cluster.local:8080
  LocalLlm__ModelName: ""
  AzureAIFoundry__DefaultModel: Gpt6Sol
  AzureAIFoundry__Models__Gpt4o__Endpoint: https://swcp-resource.services.ai.azure.com/
  AzureAIFoundry__Models__Gpt6Sol__Endpoint: https://swcp-resource.services.ai.azure.com/
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: c-sandbox-config
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
data:
  NATS_URL: nats://nats.swcp.svc.cluster.local:4222
  SANDBOX_NAMESPACE: swcp-sandbox
  SANDBOX_IMAGE: ghcr.io/allankrogaau/c-sandbox-runtime:latest
  SANDBOX_RUNTIME_CLASS: gvisor
  SANDBOX_POOL_SIZE: "4"
  SANDBOX_MAX_CONCURRENT: "8"
  LOG_LEVEL: INFO
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
type: Opaque
stringData:
  POSTGRES_PASSWORD: insert_password_from_env_or_find_it_in_discord
---
apiVersion: v1
kind: Secret
metadata:
  name: core-api-secrets
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
type: Opaque
stringData:
  DevelopmentUsers__TeacherPassword: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-worker-secrets
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
type: Opaque
stringData:
  AzureAIFoundry__Models__Gpt4o__ApiKey: ""
  AzureAIFoundry__Models__Gpt6Sol__ApiKey: ""
