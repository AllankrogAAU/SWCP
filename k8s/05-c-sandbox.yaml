apiVersion: apps/v1
kind: Deployment
metadata:
  name: c-sandbox
  namespace: swcp
  labels:
    app.kubernetes.io/name: c-sandbox
    app.kubernetes.io/part-of: swcp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: c-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c-sandbox
        app.kubernetes.io/part-of: swcp
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: ensure-streams
          image: natsio/nats-box:0.14.5
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              nats --server nats://nats.swcp.svc.cluster.local:4222 stream info SANDBOX_TASKS >/dev/null 2>&1 || \
                nats --server nats://nats.swcp.svc.cluster.local:4222 stream add SANDBOX_TASKS --subjects sandbox.tasks --retention work --storage file --replicas 1 --discard old --dupe-window 10m --max-msgs=-1 --max-bytes=-1 --max-age=0s --max-msg-size=-1 --max-msgs-per-subject=-1 --defaults
              nats --server nats://nats.swcp.svc.cluster.local:4222 stream info SANDBOX_TASKS_DLQ >/dev/null 2>&1 || \
                nats --server nats://nats.swcp.svc.cluster.local:4222 stream add SANDBOX_TASKS_DLQ --subjects sandbox.tasks.dlq --retention limits --storage file --replicas 1 --discard old --dupe-window 2m --max-msgs=-1 --max-bytes=-1 --max-age=168h --max-msg-size=-1 --max-msgs-per-subject=-1 --defaults
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: dind
          image: docker:27-dind
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            exec:
              command: ["docker", "-H", "tcp://127.0.0.1:2375", "info"]
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 40
          readinessProbe:
            exec:
              command: ["docker", "-H", "tcp://127.0.0.1:2375", "info"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["docker", "-H", "tcp://127.0.0.1:2375", "info"]
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
        - name: runtime-image-loader
          image: docker:27-cli
          command:
            - sh
            - -ec
            - |
              until docker info >/dev/null 2>&1; do sleep 2; done
              until docker image inspect c-sandbox-runtime:latest >/dev/null 2>&1; do
                if docker image inspect ghcr.io/allankrogaau/c-sandbox-runtime:latest >/dev/null 2>&1 \
                  || docker pull ghcr.io/allankrogaau/c-sandbox-runtime:latest; then
                  docker tag ghcr.io/allankrogaau/c-sandbox-runtime:latest c-sandbox-runtime:latest
                else
                  sleep 5
                fi
              done
              exec sleep infinity
          envFrom:
            - configMapRef:
                name: c-sandbox-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: c-sandbox-worker
          image: ghcr.io/allankrogaau/c-sandbox-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: c-sandbox-config
          env:
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: docker-storage
          emptyDir:
            sizeLimit: 20Gi
