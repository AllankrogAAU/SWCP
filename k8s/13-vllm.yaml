apiVersion: v1
kind: Service
metadata:
  name: local-llm-server
  namespace: swcp
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: swcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: swcp
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: swcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: swcp
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: swcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/part-of: swcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-config
          args:
            - /models/$(LLM_MODEL_PATH)
            - --served-model-name=$(LLM_MODEL_NAME)
            - --quantization=$(VLLM_QUANTIZATION)
            - --kv-cache-dtype=$(VLLM_KV_CACHE_DTYPE)
            - --max-model-len=$(VLLM_MAX_MODEL_LEN)
            - --gpu-memory-utilization=$(VLLM_GPU_MEMORY_UTILIZATION)
            - --max-num-seqs=$(VLLM_MAX_NUM_SEQS)
            - --enforce-eager
            - --host=0.0.0.0
            - --port=$(VLLM_PORT)
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "2"
              memory: "8Gi"
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "16Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /home/test/SWCP/apps/localLLM/models
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
