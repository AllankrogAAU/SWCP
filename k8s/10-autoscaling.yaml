---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: c-sandbox
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: c-sandbox
  minReplicas: 3
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
