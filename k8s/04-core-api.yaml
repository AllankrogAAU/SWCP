apiVersion: v1
kind: ServiceAccount
metadata:
  name: jwt-key-bootstrap
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jwt-key-bootstrap
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["jwt-keys"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jwt-key-bootstrap
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jwt-key-bootstrap
subjects:
  - kind: ServiceAccount
    name: jwt-key-bootstrap
    namespace: swcp
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jwt-key-bootstrap
  namespace: swcp
  labels:
    app.kubernetes.io/name: jwt-key-bootstrap
    app.kubernetes.io/part-of: swcp
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jwt-key-bootstrap
        app.kubernetes.io/part-of: swcp
    spec:
      serviceAccountName: jwt-key-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: alpine/k8s:1.31.2
          command:
            - sh
            - -ec
            - |
              if kubectl -n swcp get secret jwt-keys >/dev/null 2>&1; then
                exit 0
              fi
              command -v openssl >/dev/null 2>&1 || apk add --no-cache openssl >/dev/null
              openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/jwt-private.pem
              openssl pkey -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
              kubectl -n swcp create secret generic jwt-keys \
                --from-file=jwt-private.pem=/tmp/jwt-private.pem \
                --from-file=jwt-public.pem=/tmp/jwt-public.pem
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: swcp
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: swcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: core-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: swcp
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: swcp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        app.kubernetes.io/part-of: swcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-dependencies
          image: ghcr.io/allankrogaau/postgres:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.swcp.svc.cluster.local -p 5432; do sleep 2; done
              until nc -z nats.swcp.svc.cluster.local 4222; do sleep 2; done
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: core-api
          image: ghcr.io/allankrogaau/core-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: core-api-config
            - secretRef:
                name: core-api-secrets
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__Default
              value: Host=postgres.swcp.svc.cluster.local;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: jwt-keys
              mountPath: /private
              readOnly: true
            - name: jwt-public
              mountPath: /public
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0440
        - name: jwt-public
          emptyDir: {}
        - name: tmp
          emptyDir: {}
