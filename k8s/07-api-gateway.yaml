apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: swcp
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: swcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: swcp
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: swcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: swcp
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: swcp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: swcp
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      initContainers:
        - name: wait-for-core-api
          image: ghcr.io/allankrogaau/postgres:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z core-api.swcp.svc.cluster.local 8080; do sleep 2; done
              until nc -z nats.swcp.svc.cluster.local 4222; do sleep 2; done
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: api-gateway
          image: ghcr.io/allankrogaau/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: jwt-public
              mountPath: /public
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: jwt-public
          secret:
            secretName: jwt-keys
            defaultMode: 0440
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
        - name: tmp
          emptyDir: {}
