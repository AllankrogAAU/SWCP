apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-autoscaler
  namespace: swcp
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: swcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm
  minReplicaCount: 1
  maxReplicaCount: 1
  cooldownPeriod: 300
  pollingInterval: 15
  advanced:
    restoreToOriginalReplicaCount: true
  triggers:
    # 1. Prometheus metric: vLLM internal request queue depth
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_num_requests_waiting
        query: sum(vllm:num_requests_waiting{namespace="swcp"}) or vector(0)
        threshold: "1"
    # 2. Prometheus metric: vLLM requests currently running (concurrency pressure)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_num_requests_running
        query: sum(vllm:num_requests_running{namespace="swcp"}) or vector(0)
        threshold: "4"
