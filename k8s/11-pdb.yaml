apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: core-api
  namespace: swcp
  labels:
    app.kubernetes.io/part-of: swcp
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
