name: llm
services:
  llm-server:
    image: vllm/vllm-openai:v0.30.0
    container_name: llm_server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    environment:
      # Weights are already on disk, so never let vLLM/HF hub reach out to the network.
      - HF_HUB_OFFLINE=1
    shm_size: "2gb" # vLLM's worker processes use /dev/shm for IPC; the tiny default (64mb) causes crashes.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "/models/Qwen2.5-Coder-3B-Instruct-AWQ"
      - "--served-model-name=qwen2.5-coder-3b-instruct-awq"
      - "--quantization=awq_marlin"      # maybe not valid for older hardware
      - "--kv-cache-dtype=auto"          #fp8"
      - "--max-model-len=8192"           # to be tuned
      - "--gpu-memory-utilization=0.80"  # to be tuned
      - "--max-num-seqs=4"               # to be tuned
      - "--host=0.0.0.0"
      - "--port=8080"
    restart: unless-stopped

  llm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - LLMServerUrl=http://llm-server:8080
    depends_on:
      - llm-server
    restart: unless-stopped