name: swcp

services:
  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/apiGateway/Dockerfile
    ports:
      - "${API_PORT:-5170}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Nats__Url: nats://nats:4222
      Jwt__PublicKeyPath: /public/jwt-public.pem
      Jwt__Issuer: SWCP.CoreApi
      Jwt__Audience: SWCP.Client
      CoreApi__Url: http://core-api:8080
      ReverseProxy__Clusters__coreApi__Destinations__primary__Address: http://core-api:8080/
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:5174
    volumes:
      - jwt-public:/public:ro
    depends_on:
      nats:
        condition: service_healthy
      core-api:
        condition: service_healthy
    restart: unless-stopped

  core-api:
    build:
      context: .
      dockerfile: apps/coreApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Nats__Url: nats://nats:4222
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in the root .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in the root .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}"
      Jwt__KeyDirectory: /private
      Jwt__PublicKeyDirectory: /public
      Jwt__Issuer: SWCP.CoreApi
      Jwt__Audience: SWCP.Client
      SeedDevelopmentUsers: ${SEED_DEVELOPMENT_USERS:-false}
      DevelopmentUsers__TeacherUsername: ${DEV_TEACHER_USERNAME:-${DEV_TEACHER_EMAIL:-}}
      DevelopmentUsers__TeacherPassword: ${DEV_TEACHER_PASSWORD:-}
    volumes:
      - jwt-private:/private
      - jwt-public:/public
    depends_on:
      nats:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  llm-worker:
    build:
      context: .
      dockerfile: apps/llmWorker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      Nats__Url: nats://nats:4222
      LocalLlm__BaseUrl: http://local-llm-server:8080
      LocalLlm__ModelName: ${LLM_MODEL_NAME:-}
      AzureAIFoundry__DefaultModel: ${AzureAIFoundry__DefaultModel:-Gpt6Sol}
      AzureAIFoundry__Models__Gpt4o__Endpoint: ${AzureAIFoundry__Models__Gpt4o__Endpoint:-}
      AzureAIFoundry__Models__Gpt4o__ApiKey: ${AzureAIFoundry__Models__Gpt4o__ApiKey:-}
      AzureAIFoundry__Models__Gpt6Sol__Endpoint: ${AzureAIFoundry__Models__Gpt6Sol__Endpoint:-}
      AzureAIFoundry__Models__Gpt6Sol__ApiKey: ${AzureAIFoundry__Models__Gpt6Sol__ApiKey:-}
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  sandbox-runtime-image:
    image: c-sandbox-runtime:latest
    build:
      context: ./apps/cSandbox
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c", "true"]

  c-sandbox-worker:
    build:
      context: ./apps/cSandbox
      dockerfile: Dockerfile.worker
    environment:
      NATS_URL: nats://nats:4222
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      nats:
        condition: service_healthy
      sandbox-runtime-image:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in the root .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in the root .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in the root .env}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in the root .env}"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_GUNICORN_ACCESS_LOGFILE: "'/dev/null'"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: [frontend]
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  local-llm-server:
    profiles: [local-llm]
    image: vllm/vllm-openai:v0.30.0
    ports:
      - "${LOCAL_LLM_PORT:-8080}:8080"
    volumes:
      - ./apps/localLLM/models:/models:ro
    environment:
      HF_HUB_OFFLINE: "1"
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "/models/${LLM_MODEL_PATH:?Set LLM_MODEL_PATH in the root .env}"
      - "--served-model-name=${LLM_MODEL_NAME:?Set LLM_MODEL_NAME in the root .env}"
      - "--quantization=${VLLM_QUANTIZATION:-awq_marlin}"
      - "--kv-cache-dtype=${VLLM_KV_CACHE_DTYPE:-auto}"
      - "--max-model-len=${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.80}"
      - "--max-num-seqs=${VLLM_MAX_NUM_SEQS:-4}"
      - "--host=0.0.0.0"
      - "--port=8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 5m
    restart: unless-stopped

volumes:
  db-data:
  jwt-private:
  jwt-public:
  nats-data:
  pgadmin-data:
