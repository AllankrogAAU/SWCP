name: Build image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      push:
        required: true
        type: boolean

jobs:
  image:
    name: ${{ inputs.service }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          service=$(printf '%s' '${{ inputs.service }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/swcp-${service}" >> "$GITHUB_OUTPUT"
          echo "local=swcp-${service}:ci" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.service }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: |
            ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Tag local scan image
        if: ${{ !inputs.push }}
        run: docker tag "${{ steps.image.outputs.name }}:${{ inputs.image_tag }}" "${{ steps.image.outputs.local }}"

      - name: Scan image for CVEs
        if: ${{ !inputs.push }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.local }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
