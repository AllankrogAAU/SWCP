name: CI

on:
  pull_request:
  push: 
  workflow_dispatch:


permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      c-sandbox: ${{ steps.filter.outputs.c-sandbox }}
      cloudllm: ${{ steps.filter.outputs.cloudllm }}
      frontend: ${{ steps.filter.outputs.frontend }}
      images: ${{ steps.filter.outputs.matrix }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend: 'apps/frontend/**'  
            api: 'apps/api/**'
            cloudLLM: 'apps/cloudLLM/**'
            c-sandbox: 'apps/c-sandbox/**'
            docker:
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'docker-compose.yml'
      - name: Build image matrix from changed services
        id: images
        run: |
         matrix=$(jq -c '[.[] | select(. == "api" or . == "cloudLLM" or . == "c-sandbox" or . == "frontend")]' <<< '${{ steps.filter.outputs.changes }}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  api:
    name: API gateway
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/_api.yml

  c-sandbox:
    name: LLM service
    needs: changes
    if: needs.changes.outputs.c-sandbox == 'true'
    uses: ./.github/workflows/_c-sandbox.yml
    permissions:
      contents: read

  cloudllm:
    name: Backend service
    needs: changes
    if: needs.changes.outputs.cloudllm == 'true'
    uses: ./.github/workflows/_cloudllm.yml
    permissions:
      contents: read
    
  frontend:
    name: Frontend service
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/_frontend.yml
    permissions:
      contents: read

  images: 
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        service: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
    
      - name: Lowercase image name
        id: name
        run: echo "name=$(echo '${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with: 
          context: apps/${{ matrix.service }}
          push: false
          load: true
          tags: swcp/${{ steps.name.outputs.name }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swcp/${{ steps.name.outputs.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'   

  deploy-config:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Validate docker-compose.yml
      run: |
        cp .env
        docker compose config --quiet
    - name: Scan Dockerfiles for misconfiguration
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: config
        scan-ref: . 
        severity: CRITICAL,HIGH
        exit-code: '1'

  
  ci-gate:
    name: CI gate
    needs: [secret-scan, changes, c-sandbox, cloudllm, frontend, images, deploy-config]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed or were skipped."