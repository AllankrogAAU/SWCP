name: Sandbox Service

on:
    workflow_call:
        secrets:
            SONAR_TOKEN:
                required: true

permissions:
    contents: read

jobs:
    build-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/c-sandbox
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Install test dependencies
              run: python -m pip install --upgrade pip -r requirements.txt pytest pytest-cov ruff==0.13.0 mypy==1.18.2
            - name: Ruff check
              run: ruff check .
            - name: Mypy check
              run: mypy api sandbox evaluation main.py tests
            - name: Build sandbox runtime image
              run: docker build -f Dockerfile.sandbox -t c-sandbox-runtime:latest .
            - name: Unit tests with coverage
              run: python -m pytest -v --cov --cov-report=xml

            - name: SonarQube analysis
              uses: SonarSource/sonarqube-scan-action@v5
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              with:
                  projectBaseDir: apps/c-sandbox