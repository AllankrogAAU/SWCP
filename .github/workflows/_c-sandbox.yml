name: Sandbox Service

on:
    workflow_call:

permissions:
    contents: read

jobs: 
    build-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/c-sandbox
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - name: Install test dependencies
              run: python -m pip install --upgrade pip pytest
            - name: Build sandbox runtime image
              run: docker build -t c-sandbox-runtime:latest .
            - name: Build test fixture
              run: gcc -Wall -Wextra tests/fixtures/source_code/testprogram.c -o tests/fixtures/test
            - name: Unit tests
              run: python -m pytest -v